<!DOCTYPE html>
<html>
<head>
    <title>Fast Food Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Title -->
    <h1 class="main-title">Fast Food Menu</h1>

    <div class="menu-container">

        <div class="deals-box">
  	      <h2>Deals</h2>
        <p>Deal 1: Burger + Fries - Rs. 600</p>
        <p>Deal 2: Burger + Drink - Rs. 800</p>
	<p>Deal 3: Burger + Fries + Drink  - Rs. 1200</p>
        </div>

      <div class="center-image-box">
           <img src="combo.png.jpg" alt="Deal Image" class="deal-img">
        </div>

        <div class="main-items-box">
            <h2>Main Items</h2>
            <p>Zinger Burger - Rs. 500</p>
            <p>French Fries - Rs. 250</p>
            <p>Cold Drink - Rs. 150</p>
        </div>

        <div class="contact-box">
            <p><strong>Address:</strong> Main Street, City</p>
            <p><strong>Phone No:</strong> 0300-1234567</p>
        </div>

        <div class="order-box">
            <button class="order-btn">Order Now</button>
        </div>

    </div>

</body>
</html>
